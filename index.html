<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07030f">
<title>MovaLive</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#07030f;--card:#120a22;--ink:#f3ecff;--mute:#a597c9;--line:#2a1b4a;--soft:#1d1236;--glass:#1a0f3a8c;--gb:#ffffff1c;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 20% 20%,#8a3dff66,transparent 70%),radial-gradient(35% 30% at 85% 30%,#ff4fd844,transparent 70%),radial-gradient(40% 35% at 50% 95%,#3d7bff44,transparent 70%);filter:blur(30px)}
button,input,textarea,select{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.grow{flex:1}.mute{color:var(--mute)}.sm{font-size:13px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(135deg,#a259ff,#6f2dff);color:#fff;font-weight:700;font-size:16px;display:flex;gap:10px;justify-content:center;align-items:center;box-shadow:0 8px 26px #8a3dff66}
.btn:disabled{opacity:.4}.btn.alt{background:var(--glass);box-shadow:none;border:1px solid var(--gb)}.btn.red{background:linear-gradient(135deg,#ff5a7a,#d63a5a)}
.chip{border:1px solid var(--gb);background:var(--glass);padding:8px 16px;border-radius:99px}.chip.on{background:linear-gradient(135deg,#a259ff,#6f2dff);border-color:transparent}
.in{width:100%;padding:13px;border:1px solid var(--gb);border-radius:14px;background:var(--glass);outline:0}
.ib{border:0;background:var(--soft);border-radius:50%;width:38px;height:38px;font-size:18px;flex:none}
.err{color:#ff7a93;font-size:14px;min-height:20px}.note{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--mute)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--gb);background:var(--glass);backdrop-filter:blur(16px)}
header h2{flex:1;margin:0;font-size:22px}
main{flex:1;overflow:auto;padding:8px 12px}
nav{display:flex;margin:0 12px 10px;border-radius:28px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--gb);padding:2px 4px}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute)}
nav span{font-size:21px;transition:.2s}nav .on{color:#c9a8ff;font-weight:700}nav .on span{transform:translateY(-2px) scale(1.18);filter:drop-shadow(0 0 8px #8a3dff)}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:22px;width:100%;border:1px solid var(--gb);background:var(--glass);margin:7px 0;text-align:left;cursor:pointer}
.row .tx{flex:1;min-width:0}.row b{display:block}.row .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avw{position:relative;flex:none}.av{border-radius:50%;object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:700}
.dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#22c06b;border:2px solid var(--bg)}
.hi{border:0;background:#ff6fb133;color:#ff8fc6;border-radius:99px;padding:10px 16px;font-weight:800;flex:none}.hi.d{opacity:.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.b{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--soft);align-self:flex-start;word-wrap:break-word;white-space:pre-wrap}
.b.me{background:linear-gradient(135deg,#a259ff,#6f2dff);align-self:flex-end}.b small{display:block;font-size:11px;opacity:.75;text-align:right}.b .nm{color:#c9a8ff;font-weight:700;text-align:left;opacity:1}.rd{color:#7ff0ff}
.send{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--gb)}.send .in{flex:1;border-radius:99px}.send button{border:0;background:linear-gradient(135deg,#a259ff,#6f2dff);border-radius:50%;width:46px;height:46px;font-size:18px;color:#fff}
.sheet{position:absolute;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:5;backdrop-filter:blur(6px)}
.sheet>div{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:10px;max-height:88%;overflow:auto;border-top:1px solid var(--gb)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#241446;padding:10px 16px;border-radius:99px;z-index:9;font-size:14px;max-width:90%}
.chk{display:flex;gap:10px;text-align:left;font-size:14px;align-items:flex-start;width:100%}.chk input{width:20px;height:20px;accent-color:#8a3dff;flex:none}
.seg{align-self:flex-end;display:flex;border:1px solid var(--gb);border-radius:99px;overflow:hidden}.seg button{border:0;background:none;padding:6px 14px;font-weight:600;color:var(--mute)}.seg .on{background:#8a3dff;color:#fff}
.lgn,.stp{height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 24px 22px;gap:12px}
.lgn{background:radial-gradient(80% 50% at 50% 20%,#1b0b3d,#05020d 70%)}
.lgimg{width:200px;max-width:58%;mix-blend-mode:screen;margin-top:10px}
.ml{font-size:46px;font-style:italic;font-weight:800;margin:0;letter-spacing:-1px}.ml span{color:#a24dff}.tg{color:#cdbbff;font-size:18px;margin:0}
.so{width:100%;display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:99px;border:1.5px solid #6b3fd4;background:#1a0d3566;font-size:17px;font-weight:600}.so span:nth-child(2){flex:1;text-align:center}.so.g{background:#fff;color:#1b1230;border:0}.so:disabled{opacity:.5}
.lgn u{color:#c08bff}
.stp{align-items:stretch;text-align:left}.stp h2{text-align:center;margin:0;font-size:26px}.pp{color:#a24dff}
.ph2{position:relative;width:140px;height:140px;margin:6px auto}.ring{width:100%;height:100%;border-radius:50%;border:3px solid #8a3dff;box-shadow:0 0 28px #8a3dffaa;overflow:hidden;display:grid;place-items:center;background:#0c0620}.ring img{width:100%;height:100%;object-fit:cover}
.cam{position:absolute;right:2px;bottom:6px;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#a259ff,#6f2dff);display:grid;place-items:center;font-size:20px;cursor:pointer}
.lb{font-weight:700;margin:6px 0}.sel{display:flex;gap:8px}.sel select{flex:1;padding:13px;border:1px solid var(--gb);border-radius:14px;background:var(--glass)}.sel option{background:#120a22}
.ban{display:flex;align-items:center;justify-content:space-between;border-radius:22px;padding:16px;background:linear-gradient(135deg,#3b1a8a,#1c0b45);border:1px solid #8a3dff66;margin:6px 0 14px}.ban h3{margin:0 0 4px;font-size:21px}.ban p{margin:0;font-size:13px;color:#cdbbff}.crn{font-size:60px}
.th{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px}.sec{margin:12px 4px 4px;font-weight:700}
</style></head><body><div id="app"></div>

function loginV(){const q=t("terms");return `<div class="lgn">${seg()}<img class="lgimg" src="${LOGO}" alt="M"><h1 class="ml">Mova<span>Live</span></h1><p class="tg">${t("tag")}</p><div class="grow"></div><button class="so g" data-a="google">${GI}<span>${t("google")}</span></button><button class="so" disabled><span>📱</span><span>${t("phone")}</span></button><label class="chk"><input type="checkbox" id="ok" ${S.ok?"checked":""}><span><b>${t("age18")}</b><br><u>${q[0]}</u> ${q[1]} <u>${q[2]}</u> ${q[3]}</span></label><div class="err">${esc(S.err)}</div></div>`}
function bsel(){const s=S.setup,cy=new Date().getFullYear(),o=(a,ph,sel)=>`<option value="">${ph}</option>`+a.map(([v,l])=>`<option value="${v}" ${String(sel)==String(v)?"selected":""}>${l}</option>`).join("");return `<div class="sel"><select id="bdd">${o([...Array(31)].map((_,i)=>[i+1,i+1]),t("day"),s.d)}</select><select id="bdm">${o(t("mon").map((l,i)=>[i+1,l]),t("month"),s.m)}</select><select id="bdy">${o([...Array(63)].map((_,i)=>[cy-18-i,cy-18-i]),t("year"),s.y)}</select></div>`}
function setupV(){const s=S.setup,ps='<svg viewBox="0 0 100 100" width="70%"><circle cx="50" cy="38" r="18" fill="#b79cff"/><path d="M16 92c2-22 18-32 34-32s32 10 34 32z" fill="#b79cff"/></svg>';return `<div class="stp">${seg()}<h2>${t("setA")} <span class="pp">${t("setB")}</span></h2><p class="mute" style="margin:0;text-align:center">${t("setSub")}</p><div class="ph2"><div class="ring">${S.photo?`<img src="${S.photo}" alt="">`:ps}</div><label class="cam" for="pf">📷</label><input type="file" id="pf" accept="image/*" hidden></div><div><div class="lb">${t("uname")}</div><input class="in" id="nn" maxlength="20" placeholder="${t("uph")}" value="${esc(s.nick)}"></div><div><div class="lb">${t("gender")}</div><div class="chips"><button class="chip ${s.g=="m"?"on":""}" data-a="g" data-g="m">${t("male")}</button><button class="chip ${s.g=="f"?"on":""}" data-a="g" data-g="f">${t("female")}</button></div></div><div><div class="lb">${t("birth")}</div>${bsel()}</div><div class="note">🔒 ${t("lock")}</div><div><div class="lb">${t("opt")}</div><textarea class="in" id="ab" maxlength="100" rows="2" placeholder="${t("aph")}">${esc(s.about)}</textarea></div><div class="err">${esc(S.err)}</div><button class="btn" data-a="save">${t("go")} →</button><button class="btn alt" data-a="signout">${t("signout")}</button></div>`}
function homeV(){return `<div class="ban"><div><h3>${t("wt")}</h3><p>${t("ws")}</p></div><div class="crn">👑</div></div><div class="sec">🔥 ${t("liveR")}</div>${S.rooms.map(r=>`<div class="row" data-a="room" data-id="${esc(r.id)}"><div class="th" style="background:linear-gradient(135deg,hsl(${hue(r.name)} 80% 58%),hsl(${(hue(r.name)+60)%360} 70% 32%))">💬</div><div class="tx"><b>${esc(r.name)}</b><div class="mute sm">${esc(r.ownerNick||"")}</div></div></div>`).join("")}`}
function peopleList(){const f=S.users.filter(u=>u.id!=S.me.id&&!S.blocked.has(u.id)&&(S.gf=="all"||u.gender==S.gf));return f.length?f.map(u=>`<div class="row" data-a="user" data-id="${esc(u.id)}">${avatar(u,50,1)}<div class="tx"><b>${esc(u.nick)}, ${ageOf(u)}</b><div class="mute sm">${u.gender=="f"?"♀":"♂"} · ${isOn(u)?t("online"):t("offline")}</div></div><button class="hi ${S.hi.has(u.id)?"d":""}" data-a="hi" data-id="${esc(u.id)}">${S.hi.has(u.id)?"✓":"💜 "+t("hi")}</button></div>`).join(""):`<p class="mute">${t("none")}</p>`}
function peopleV(){return `<div class="chips">${[["all",t("all")],["m",t("male")],["f",t("female")]].map(([v,n])=>`<button class="chip ${S.gf==v?"on":""}" data-a="gf" data-v="${v}">${n}</button>`).join("")}</div><div id="pl">${peopleList()}</div>`}
function msgsV(){const l=S.chats.slice().sort((a,b)=>ms(b.lastAt)-ms(a.lastAt));return l.length?l.map(c=>{const pid=c.members.find(x=>x!=S.me.id);if(S.blocked.has(pid))return"";const u=mkU(pid);if(!u)getU(pid).then(()=>soft());const nm=(c.names&&c.names[pid])||(u&&u.nick)||"…";return `<div class="row" data-a="dm" data-id="${esc(pid)}">${avatar(u||{nick:nm},50,1)}<div class="tx"><b>${esc(nm)}</b><div class="mute sm">${esc(c.last||"")}</div></div></div>`}).join(""):`<p class="mute" style="padding:12px">${t("noChats")}</p>`}
function profV(){const m=S.me,mine=S.rooms.filter(r=>r.owner==m.id);return `<div style="display:flex;gap:14px;align-items:center;padding:8px">${avatar(m,72)}<div><h2 style="margin:0">${esc(m.nick)}</h2><div class="mute sm">${ageOf(m)} · ${m.gender=="f"?t("female"):t("male")} 🔒</div></div></div><div class="sec">${t("about")}</div><textarea class="in" id="ab2" maxlength="100" rows="2">${esc(m.about||"")}</textarea><button class="btn alt" style="margin:8px 0" data-a="saveAbout">${t("save")}</button><div class="sw sec"><span>🏠 ${t("myRooms")}</span><button class="chip on" data-a="newroom">${t("newroom")}</button></div>${mine.length?mine.map(r=>`<div class="row"><div class="tx" data-a="room" data-id="${esc(r.id)}"><b>${esc(r.name)}</b></div><button class="chip" data-a="delroom" data-id="${esc(r.id)}">🗑</button></div>`).join(""):`<div class="mute sm" style="padding:4px">${t("noRooms")}</div>`}<div style="height:12px"></div>${seg()}<div style="height:12px"></div><button class="btn alt" data-a="signout">${t("signout")}</button><div style="height:8px"></div><button class="btn red" data-a="delq">${t("del")}</button>`}
const NAV=[["home","🏠","home"],["people","🧭","people"],["msgs","💬","msgs"],["me","👤","prof"]];
function appV(){const tab=S.tab;return `<header><h2>${tab=="home"?"MovaLive":t(tab=="me"?"prof":tab)}</h2></header><main>${tab=="home"?homeV():tab=="people"?peopleV():tab=="msgs"?msgsV():profV()}</main><nav>${NAV.map(x=>`<button data-a="tab" data-k="${x[0]}" class="${S.tab==x[0]?"on":""}"><span>${x[1]}</span>${t(x[2])}</button>`).join("")}</nav>`}
function chatV(){const v=S.view,u=v.t=="dm"?mkU(v.peer):null;return `<header><button class="ib" data-a="back">‹</button>${u?avatar(u,40,1):""}<h2 style="font-size:19px">${esc(v.title)}${u?`<div class="mute sm" style="font-weight:400">${isOn(u)?t("online"):t("offline")}</div>`:""}</h2>${u?`<button class="ib" data-a="user" data-id="${esc(v.peer)}">⋯</button>`:""}</header><div class="msgs" id="ms"></div><form class="send" id="sf"><input class="in" id="tx" maxlength="500" placeholder="${t("typeMsg")}" autocomplete="off"><button>➤</button></form>`}
function paint(){const e=$("#ms");if(!e||!S.view)return;const dm=S.view.t=="dm";e.innerHTML=S.msgs.slice().reverse().filter(m=>!S.blocked.has(m.uid)).map(m=>{const me=m.uid===S.me.id,d=m.createdAt&&m.createdAt.toDate?m.createdAt.toDate():new Date(),h=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");return `<div class="b ${me?"me":""}">${!me&&!dm?`<small class="nm">${esc(m.nick)}</small>`:""}${esc(m.text)}<small>${h}${me&&dm?` <span class="${m.read?"rd":""}">${m.read?"✓✓":"✓"}</span>`:""}</small></div>`}).join("");e.scrollTop=e.scrollHeight}
function sheetV(){const s=S.sheet;if(!s)return"";if(s.t=="nr")return `<div class="sheet" data-a="close"><div data-a="keep"><b>${t("newroom")}</b><input class="in" id="rn" maxlength="30" placeholder="${t("roomname")}"><button class="btn" data-a="mkroom">${t("create")}</button></div></div>`;if(s.t=="del")return `<div class="sheet" data-a="close"><div data-a="keep"><b>${t("delq")}</b><button class="btn red" data-a="delyes">${t("del")}</button><button class="btn alt" data-a="close">${t("cancel")}</button></div></div>`;const u=mkU(s.id);if(!u)return"";return `<div class="sheet" data-a="close"><div data-a="keep"><div style="display:flex;gap:12px;align-items:center">${avatar(u,56,1)}<div><b>${esc(u.nick)}, ${ageOf(u)}</b><div class="mute sm">${esc(u.about||"")}</div></div></div><button class="btn" data-a="dm" data-id="${esc(u.id)}">${t("msg")}</button><button class="btn alt" data-a="report" data-id="${esc(u.id)}">${t("report")}</button><button class="btn red" data-a="block" data-id="${esc(u.id)}">${t("block")}</button></div></div>`}
function render(){const a=$("#app");let h="";if(S.scr=="login")h=loginV();else if(S.scr=="setup")h=setupV();else if(S.scr=="app")h=S.view?chatV():appV();else h='<div class="lgn"><div class="grow"></div><img class="lgimg" src="'+LOGO+'" alt=""><div class="grow"></div></div>';a.innerHTML=h+sheetV();if(S.view)paint();sync()}
function soft(){if(S.scr=="app"&&!S.view&&!S.sheet)render()}
const depth=()=>(S.scr=="setup"?0:0)+(S.scr=="app"&&S.tab!="home"?1:0)+(S.view?1:0)+(S.sheet?1:0);
let hd=0,ign=0;
function sync(){try{const d=depth();if(d>hd){for(let i=hd;i<d;i++)history.pushState({d:i+1},"");hd=d}else if(d<hd){const n=hd-d;hd=d;ign++;history.go(-n)}}catch(e){}}
window.addEventListener("popstate",()=>{if(ign>0){ign--;return}hd=Math.max(0,hd-1);if(S.sheet)S.sheet=null;else if(S.view){closeChat(true);return}else if(S.scr=="app"&&S.tab!="home")S.tab="home";render()});
function closeChat(noRender){if(unMsg){unMsg();unMsg=null}S.view=null;S.msgs=[];if(!noRender)render();else render()}
function openChat(v){S.sheet=null;S.view=v;S.msgs=[];render();if(unMsg)unMsg();const col=v.t=="dm"?collection(db,"chats",v.id,"messages"):collection(db,"rooms",v.id,"messages");unMsg=onSnapshot(query(col,orderBy("createdAt","desc"),limit(100)),s=>{S.msgs=s.docs.map(d=>({id:d.id,ref:d.ref,...d.data()}));paint();if(v.t=="dm")s.docs.forEach(d=>{const x=d.data();if(x.uid!==S.me.id&&!x.read)updateDoc(d.ref,{read:true}).catch(()=>{})})},fail)}
async function sendMsg(text,v){v=v||S.view;text=String(text||"").trim().slice(0,500);if(!text)return;const me=S.me;try{if(v.t=="dm"){const peer=await getU(v.peer),names={};names[me.id]=me.nick;names[v.peer]=peer?peer.nick:"";await setDoc(doc(db,"chats",v.id),{members:[me.id,v.peer],names,last:text,lastAt:serverTimestamp(),lastBy:me.id},{merge:true});await addDoc(collection(db,"chats",v.id,"messages"),{uid:me.id,nick:me.nick,text,createdAt:serverTimestamp(),read:false})}else{await addDoc(collection(db,"rooms",v.id,"messages"),{uid:me.id,nick:me.nick,text,createdAt:serverTimestamp()})}}catch(e){fail(e);return false}}
function startApp(){S.scr="app";S.tab="home";const uid=S.me.id;
unsubs.push(onSnapshot(query(collection(db,"users"),orderBy("lastSeen","desc"),limit(100)),s=>{S.users=s.docs.map(d=>({id:d.id,...d.data()}));S.users.forEach(u=>S.cache[u.id]=u);if(S.cache[uid])S.me={...S.me,...S.cache[uid]};soft()},fail));
let seeded=false;unsubs.push(onSnapshot(query(collection(db,"rooms"),orderBy("createdAt","desc"),limit(50)),s=>{S.rooms=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.docs.length&&!seeded){seeded=true;addDoc(collection(db,"rooms"),{name:"Genel Sohbet",owner:uid,ownerNick:"MovaLive",createdAt:serverTimestamp()}).catch(()=>{})}soft()},fail));
unsubs.push(onSnapshot(query(collection(db,"chats"),where("members","array-contains",uid)),s=>{S.chats=s.docs.map(d=>({id:d.id,...d.data()}));soft()},fail));
unsubs.push(onSnapshot(collection(db,"blocks",uid,"list"),s=>{S.blocked=new Set(s.docs.map(d=>d.id));soft()},fail));
const beat=()=>updateDoc(doc(db,"users",uid),{lastSeen:serverTimestamp()}).catch(()=>{});beat();const iv=setInterval(beat,60000);unsubs.push(()=>clearInterval(iv));render()}
const A={
lang(e){L=e.dataset.l;localStorage.setItem("lang",L);render()},
async google(){if(!S.ok){toast(t("needok"));return}try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){S.err=e.code||String(e);render()}},
g(e){S.setup.g=e.dataset.g;render()},
async save(){const s=S.setup,u=auth.currentUser;if(!u)return;const nick=s.nick.trim();let er="";const bd=new Date(+s.y,+s.m-1,+s.d);if(nick.length<3)er=t("e_nick");else if(!s.g)er=t("e_gender");else if(!s.d||!s.m||!s.y||isNaN(bd)||bd.getDate()!=+s.d)er=t("e_birth");else if((Date.now()-bd.getTime())/864e5<6575)er=t("e_18");S.err=er;if(er){render();return}
try{const b=writeBatch(db);b.set(doc(db,"users",u.uid),{nick,gender:s.g,birthYear:+s.y,about:s.about.slice(0,100),photo:S.photo||"",createdAt:serverTimestamp(),lastSeen:serverTimestamp()});b.set(doc(db,"users",u.uid,"private","dob"),{birthDate:Timestamp.fromDate(bd)});await b.commit();const sn=await getDoc(doc(db,"users",u.uid));S.me={id:u.uid,...sn.data()};S.cache[u.uid]=S.me;startApp()}catch(e){S.err=(e.code||"")+" "+(e.message||"");render()}},
tab(e){S.tab=e.dataset.k;render()},
room(e){const r=S.rooms.find(x=>x.id==e.dataset.id);openChat({t:"room",id:e.dataset.id,title:r?r.name:""})},
async dm(e){const id=e.dataset.id,u=await getU(id);S.sheet=null;openChat({t:"dm",id:chatId(S.me.id,id),peer:id,title:u?u.nick:""})},
user(e){S.sheet={t:"user",id:e.dataset.id};render()},
async hi(e){const id=e.dataset.id;if(S.hi.has(id))return;S.hi.add(id);const ok=await sendMsg("💜 Hi",{t:"dm",id:chatId(S.me.id,id),peer:id});if(ok===false)S.hi.delete(id);else toast(t("hisent"));$("#pl")&&($("#pl").innerHTML=peopleList())},
gf(e){S.gf=e.dataset.v;render()},
back(){closeChat()},close(){S.sheet=null;render()},keep(){},
async block(e){const id=e.dataset.id;try{await setDoc(doc(db,"blocks",S.me.id,"list",id),{at:serverTimestamp()});S.sheet=null;if(S.view&&S.view.peer==id)closeChat(true);render();toast(t("blocked"))}catch(x){fail(x)}},
async report(e){try{await addDoc(collection(db,"reports"),{by:S.me.id,target:e.dataset.id,at:serverTimestamp()});S.sheet=null;render();toast(t("reported"))}catch(x){fail(x)}},
async saveAbout(){const v=($("#ab2").value||"").slice(0,100);try{await updateDoc(doc(db,"users",S.me.id),{about:v});S.me.about=v;toast(t("saved"))}catch(x){fail(x)}},
newroom(){S.sheet={t:"nr"};render()},
async mkroom(){const n=($("#rn").value||"").trim();if(n.length<3)return;try{await addDoc(collection(db,"rooms"),{name:n.slice(0,30),owner:S.me.id,ownerNick:S.me.nick,createdAt:serverTimestamp()});S.sheet=null;render()}catch(x){fail(x)}},
async delroom(e){try{await deleteDoc(doc(db,"rooms",e.dataset.id))}catch(x){fail(x)}},
async signout(){try{await signOut(auth)}catch(x){fail(x)}},
delq(){S.sheet={t:"del"};render()},
async delyes(){const u=auth.currentUser;if(!u)return;const id=u.uid;try{const b=writeBatch(db);b.delete(doc(db,"users",id,"private","dob"));b.delete(doc(db,"users",id));await b.commit();try{await deleteUser(u)}catch(e){if(e.code=="auth/requires-recent-login"){await reauthenticateWithPopup(u,new GoogleAuthProvider());await deleteUser(u)}else throw e}S.sheet=null}catch(x){fail(x)}}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;if(el.dataset.a=="close"&&e.target!==el)return;if(el.tagName=="INPUT")return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el)}});
document.addEventListener("change",async e=>{const el=e.target;if(el.id=="ok"){S.ok=el.checked?1:0;return}if(el.id=="pf"&&el.files[0]){try{S.photo=await resize(el.files[0]);render()}catch(x){fail(x)}return}if(el.id=="bdd")S.setup.d=el.value;else if(el.id=="bdm")S.setup.m=el.value;else if(el.id=="bdy")S.setup.y=el.value});
document.addEventListener("input",e=>{const el=e.target;if(el.id=="nn")S.setup.nick=el.value;else if(el.id=="ab")S.setup.about=el.value});
document.addEventListener("submit",async e=>{if(e.target.id=="sf"){e.preventDefault();const i=$("#tx"),v=i.value.trim();if(v){i.value="";const r=await sendMsg(v);if(r===false)i.value=v}}});
onAuthStateChanged(auth,async u=>{stopAll();S.msgs=[];if(!u){S.me=null;S.scr="login";S.err="";render();return}S.err="";try{const sn=await getDoc(doc(db,"users",u.uid));if(sn.exists()){S.me={id:u.uid,...sn.data()};S.cache[u.uid]=S.me;startApp()}else{S.scr="setup";S.setup.nick=(u.displayName||"").slice(0,20);render()}}catch(e){S.scr="login";S.err=(e.code||"")+" "+(e.message||"");render()}});
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
